<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d18">
  <meta name="description" content="Take a break with a live selection of popular meme templates and a surprise video." />
  <meta name="robots" content="index, follow">

  <link rel="icon" type="image/svg+xml" href="https://memebreak.pages.dev/logo.svg?v=2">
  <meta property="og:title" content="MemeBreak">
  <meta property="og:description" content="Take a break. Get the memes. Your daily dose of internet favorites.">
  <meta property="og:type" content="website">

  <meta property="og:image" content="https://memebreak.pages.dev/social-preview.png?v=3">
  <meta property="og:image:secure_url" content="https://memebreak.pages.dev/social-preview.png?v=3">
  <meta property="og:image:type" content="image/png">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MemeBreak">
  <meta name="twitter:description" content="Take a break. Get the memes. Your daily dose of internet favorites.">
  <meta name="twitter:image" content="https://memebreak.pages.dev/social-preview.png?v=3">
  <meta name="twitter:image:alt" content="MemeBreak glass-style social preview with colorful meme cards">
  <title>MemeBreak | Popular Memes</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap");

    :root {
      color-scheme: dark;
      --ink: #f1f5fc;
      --muted: #a5b4c7;
      --teal: #78ead6;
      --sky: #8abaff;
      --violet: #b5a1ff;
      --line: rgb(180 211 255 / 20%);
      --glass: rgb(17 29 47 / 64%);
    }

    * {
      box-sizing: border-box;
    }

    body {
      position: relative;
      isolation: isolate;
      min-height: 100%;
      margin: 0;
      color: var(--ink);
      background-color: #080d18;
      background-image:
        radial-gradient(ellipse at 16% 16%, rgb(71 183 197 / 17%), transparent 38%),
        radial-gradient(ellipse at 84% 18%, rgb(114 94 198 / 17%), transparent 36%),
        linear-gradient(145deg, #080d18 0%, #0c1523 52%, #101427 100%),
        linear-gradient(rgb(173 205 255 / 5%) 1px, transparent 1px),
        linear-gradient(90deg, rgb(173 205 255 / 5%) 1px, transparent 1px);
      background-size: cover, cover, cover, 56px 56px, 56px 56px;
      background-position: 0 0, 0 0, 0 0;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      animation: background-drift 34s ease-in-out infinite alternate;
    }

    body::before,
    body::after {
      position: fixed;
      z-index: -1;
      border: 1px solid rgb(190 224 255 / 18%);
      content: "";
      pointer-events: none;
      backdrop-filter: blur(2px);
    }

    body::before {
      top: 17%;
      left: -54px;
      width: 190px;
      height: 190px;
      border-radius: 42% 58% 56% 44% / 45% 42% 58% 55%;
      background: linear-gradient(145deg, rgb(166 226 255 / 12%), rgb(113 101 187 / 4%));
      box-shadow: inset 12px 12px 32px rgb(206 237 255 / 10%), 0 20px 60px rgb(0 0 0 / 18%), 0 0 46px rgb(76 190 205 / 6%);
      animation: orb-drift 13s ease-in-out infinite alternate;
    }

    body::after {
      right: -48px;
      bottom: 10%;
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 27%, rgb(217 244 255 / 50%), rgb(111 139 218 / 28%) 56%, rgb(105 82 175 / 10%));
      box-shadow: inset -12px -16px 36px rgb(180 205 255 / 9%), 0 24px 70px rgb(0 0 0 / 24%);
      animation: orb-drift 16s 1s ease-in-out infinite alternate-reverse;
    }

    button {
      font: inherit;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(120deg, rgb(25 42 63 / 70%), rgb(13 23 39 / 64%));
      box-shadow: 0 12px 36px rgb(0 0 0 / 25%), inset 0 1px 0 rgb(226 240 255 / 12%);
      backdrop-filter: blur(24px) saturate(145%);
      animation: bar-enter 600ms ease-out both;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-size: 19px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 34px;
      height: 34px;
    }

    .brand span {
      color: var(--teal);
      text-shadow: 0 0 18px rgb(120 234 214 / 28%);
      animation: logo-glow 4s ease-in-out infinite;
    }

    .top-note {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      animation: note-enter 650ms 180ms ease-out backwards;
    }

    .page {
      max-width: 1180px;
      margin: 0 auto;
      position: relative;
      isolation: isolate;
      padding: 70px 28px 72px;
    }

    .intro {
      position: relative;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 34px;
    }

    .intro::before,
    .intro::after {
      position: absolute;
      z-index: -1;
      content: "";
      pointer-events: none;
    }

    .intro::before {
      top: -48px;
      left: 49%;
      width: 116px;
      height: 116px;
      border: 1px solid rgb(218 238 255 / 23%);
      border-radius: 34% 66% 48% 52% / 52% 43% 57% 48%;
      background: linear-gradient(145deg, rgb(185 226 255 / 16%), rgb(139 123 223 / 8%));
      box-shadow: inset 8px 8px 24px rgb(221 240 255 / 12%), 0 20px 48px rgb(0 0 0 / 20%);
      backdrop-filter: blur(12px);
      animation: glass-float 9s ease-in-out infinite;
    }

    .intro::after {
      top: -20px;
      right: 8%;
      width: 66px;
      height: 66px;
      border: 1px solid rgb(222 237 255 / 26%);
      border-radius: 50%;
      background: radial-gradient(circle at 32% 27%, #e8ffff, #79b3f7 55%, #8977dc 100%);
      box-shadow: inset -6px -8px 15px rgb(30 50 112 / 23%), 0 16px 36px rgb(67 105 202 / 22%);
      animation: orb-drift 7s 800ms ease-in-out infinite alternate;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--teal);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-size: clamp(42px, 7vw, 76px);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -0.065em;
    }

    .intro-copy {
      max-width: 280px;
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .intro {
      animation: intro-enter 700ms 80ms cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    h1 {
      animation: heading-enter 800ms 140ms cubic-bezier(0.18, 0.8, 0.25, 1) backwards;
      text-shadow: 0 8px 34px rgb(120 180 255 / 18%);
    }

    .intro-copy {
      animation: note-enter 700ms 300ms ease-out backwards;
    }

    .meme-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      perspective: 1000px;
    }

    .meme-card {
      overflow: hidden;
      min-width: 0;
      position: relative;
      border: 1px solid rgb(196 222 255 / 22%);
      border-radius: 18px;
      background: linear-gradient(150deg, rgb(23 39 60 / 76%), rgb(13 24 41 / 72%));
      box-shadow: 0 16px 38px rgb(0 0 0 / 30%), inset 0 1px 0 rgb(226 240 255 / 13%);
      backdrop-filter: blur(22px) saturate(145%);
      animation: tile-enter 650ms cubic-bezier(0.2, 0.75, 0.25, 1) backwards;
      transition: transform 420ms cubic-bezier(0.2, 0.75, 0.25, 1), border-color 300ms ease, box-shadow 300ms ease;
    }

    .meme-card::after {
      position: absolute;
      z-index: 1;
      inset: 0;
      background: linear-gradient(112deg, transparent 28%, rgb(198 231 255 / 18%) 48%, transparent 68%);
      content: "";
      opacity: 0;
      pointer-events: none;
      transform: translateX(-70%);
      transition: opacity 250ms ease;
    }

    .meme-card:hover {
      transform: translateY(-7px) rotateX(1.5deg) rotateY(-1deg);
      border-color: rgb(169 227 255 / 55%);
      box-shadow: 0 26px 48px rgb(0 0 0 / 38%), 0 0 24px rgb(101 206 220 / 14%);
    }

    .meme-card:hover::after {
      opacity: 1;
      animation: card-shine 900ms ease-out both;
    }

    .meme-card img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #111b2b;
      transition: transform 500ms cubic-bezier(0.2, 0.75, 0.25, 1), filter 500ms ease;
    }

    .meme-card:hover img {
      transform: scale(1.055);
      filter: saturate(1.15);
    }

    .meme-meta {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr);
      align-items: center;
      gap: 2px 10px;
      min-height: 66px;
      padding: 10px 12px;
      border-top: 1px solid rgb(190 221 255 / 18%);
      background: rgb(9 17 29 / 78%);
      backdrop-filter: blur(18px) saturate(150%);
    }

    .meme-rank {
      display: grid;
      width: 30px;
      height: 30px;
      grid-row: span 2;
      place-items: center;
      border: 1px solid rgb(167 223 255 / 26%);
      border-radius: 50%;
      color: #a6f3e6;
      background: linear-gradient(145deg, rgb(42 78 102 / 72%), rgb(29 43 75 / 78%));
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgb(0 0 0 / 22%);
    }

    .meme-name {
      overflow: hidden;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .meme-label {
      color: #8498b2;
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .type-meme {
      display: flex;
      min-height: 260px;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-size: 28px;
      line-height: 1.15;
    }

    .type-meme.aqua {
      color: #f1f5fc;
      background: linear-gradient(145deg, #163b50, #27345a);
    }

    .type-meme.ice {
      color: #f1f5fc;
      background: linear-gradient(145deg, #293351, #3c315e);
    }

    .prompt-backdrop,
    .scare {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .prompt-backdrop {
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgb(3 7 14 / 54%);
      backdrop-filter: blur(12px) saturate(130%);
      animation: backdrop-enter 360ms ease-out both;
    }

    .prompt {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid rgb(206 230 255 / 28%);
      border-radius: 24px;
      background: linear-gradient(145deg, rgb(29 48 72 / 82%), rgb(13 23 40 / 78%));
      box-shadow: 0 28px 90px rgb(0 0 0 / 54%), inset 0 1px 0 rgb(226 242 255 / 18%), inset 0 -1px 0 rgb(130 161 201 / 10%);
      backdrop-filter: blur(34px) saturate(150%);
      text-align: center;
      animation: glass-enter 520ms cubic-bezier(0.18, 0.8, 0.25, 1) both;
    }

    .prompt::before {
      position: absolute;
      z-index: 0;
      inset: -60% -90%;
      background: linear-gradient(110deg, transparent 42%, rgb(211 237 255 / 19%) 50%, transparent 58%);
      content: "";
      pointer-events: none;
      animation: glass-sweep 8s ease-in-out infinite;
    }

    .prompt > * {
      position: relative;
      z-index: 1;
    }

    .prompt-mark {
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      margin: 0 auto 18px;
      border-radius: 50%;
      color: #f4fbff;
      background: linear-gradient(145deg, #6ee8d5, #4ba9d6 58%, #6977d7);
      box-shadow: 0 8px 24px rgb(84 205 218 / 24%);
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-size: 25px;
      animation: mark-pulse 3.5s ease-in-out infinite;
    }

    .prompt-warning {
      margin-bottom: 9px !important;
      color: var(--teal) !important;
      font-size: 11px !important;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      animation: note-enter 650ms 170ms ease-out backwards;
    }

    .prompt h2 {
      margin: 0 0 9px;
      font-family: "DM Sans", "Trebuchet MS", sans-serif;
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .prompt p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .prompt-actions {
      display: flex;
      gap: 10px;
      margin-top: 26px;
      animation: actions-enter 650ms 300ms ease-out backwards;
    }

    .choice {
      min-height: 48px;
      flex: 1;
      border: 1px solid rgb(205 229 255 / 22%);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: transform 140ms ease, filter 140ms ease;
    }

    .choice:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    .choice-yes {
      position: relative;
      overflow: hidden;
      color: #07131c;
      background: linear-gradient(120deg, #78ead6, #8abaff 62%, #b5a1ff);
      box-shadow: 0 8px 22px rgb(89 200 222 / 22%);
      animation: yes-glow 4s ease-in-out infinite;
    }

    .choice-yes::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgb(255 255 255 / 48%) 50%, transparent 70%);
      content: "";
      pointer-events: none;
      animation: glass-sweep 6s ease-in-out infinite;
    }

    .choice-no {
      color: var(--ink);
      background: rgb(127 157 195 / 14%);
      backdrop-filter: blur(10px);
    }

    .reopen-button {
      margin-top: 22px;
      padding: 10px 14px;
      border: 1px solid rgb(205 229 255 / 22%);
      border-radius: 12px;
      color: var(--ink);
      background: rgb(21 36 56 / 72%);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgb(0 0 0 / 25%), inset 0 1px 0 rgb(226 240 255 / 12%);
      backdrop-filter: blur(18px);
      transition: transform 180ms ease, background 180ms ease;
      animation: actions-enter 700ms 900ms backwards;
    }

    .reopen-button:hover {
      transform: translateY(-2px);
      background: rgb(32 53 79 / 88%);
    }

    .scare {
      z-index: 1;
      background: #03060b;
    }

    .scare video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scare[hidden],
    .prompt-backdrop[hidden] {
      display: none;
    }

    @keyframes bar-enter {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes background-drift {
      to { background-position: 0 0, 0 0, 0 0, 56px 56px, -56px 0; }
    }

    @keyframes logo-glow {
      0%, 100% { text-shadow: 0 0 12px rgb(120 234 214 / 14%); }
      50% { text-shadow: 0 0 22px rgb(120 234 214 / 48%); }
    }

    @keyframes note-enter {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heading-enter {
      from { opacity: 0; transform: translateY(24px) scale(0.97); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes intro-enter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes tile-enter {
      from { opacity: 0; transform: translateY(22px) scale(0.97); filter: blur(5px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes backdrop-enter {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes glass-enter {
      from { opacity: 0; transform: translateY(14px) scale(0.96); filter: blur(8px); }
      to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    @keyframes glass-sweep {
      0%, 22% { transform: translateX(-48%); }
      72%, 100% { transform: translateX(48%); }
    }

    @keyframes mark-pulse {
      0%, 100% { box-shadow: 0 0 18px rgb(102 202 231 / 18%); transform: scale(1); }
      50% { box-shadow: 0 0 30px rgb(120 234 214 / 40%); transform: scale(1.045); }
    }

    @keyframes actions-enter {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes yes-glow {
      0%, 100% { box-shadow: 0 8px 22px rgb(89 200 222 / 18%); }
      50% { box-shadow: 0 8px 30px rgb(116 181 255 / 42%); }
    }

    @keyframes orb-drift {
      0% { transform: translate3d(0, 0, 0) rotate(-8deg); }
      100% { transform: translate3d(18px, -16px, 0) rotate(10deg); }
    }

    @keyframes glass-float {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(-8deg); }
      50% { transform: translate3d(12px, -16px, 0) rotate(5deg); }
    }

    @keyframes card-shine {
      from { transform: translateX(-70%); }
      to { transform: translateX(70%); }
    }

    @media (max-width: 720px) {
      .topbar {
        margin: 10px 10px 0;
        padding: 14px 16px;
      }

      .top-note {
        max-width: 130px;
        text-align: right;
      }

      .page {
        padding: 44px 20px 52px;
      }

      .intro {
        align-items: start;
        flex-direction: column;
        gap: 12px;
      }

      .meme-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .meme-meta {
        grid-template-columns: 25px minmax(0, 1fr);
        gap: 2px 7px;
        padding: 9px;
      }

      .meme-rank {
        width: 25px;
        height: 25px;
      }

      .prompt {
        padding: 30px 22px;
      }

      .intro::before {
        left: auto;
        right: 8%;
        width: 84px;
        height: 84px;
      }

      .intro::after {
        right: 0;
        width: 48px;
        height: 48px;
      }
    }

    @media (max-width: 380px) {
      .meme-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="brand" href="#top"><img src="logo.svg?v=2" alt="">Meme<span>Break</span></a>
      <span class="top-note">Popular templates, freshly picked</span>
    </header>

    <section class="page" id="top">
      <div class="intro">
        <div>
          <p class="eyebrow">Trending templates</p>
          <h1>MemeBreak</h1>
        </div>
        <p class="intro-copy">Twelve internet favorites, refreshed from the popular template list.</p>
      </div>

      <div class="meme-grid" id="meme-grid" aria-label="Trending meme templates" aria-busy="true"></div>

      <button class="reopen-button" id="reopen-button" type="button">Ask me again</button>
    </section>

    <section class="prompt-backdrop" id="prompt-backdrop" aria-label="Meme prompt">
      <div class="prompt" role="dialog" aria-modal="true" aria-labelledby="prompt-title" aria-describedby="prompt-description">
        <div class="prompt-mark" aria-hidden="true">!</div>
        <p class="prompt-warning">Warning: may cause fatal giggles</p>
        <h2 id="prompt-title">Do you want to see memes?</h2>
        <p id="prompt-description">Proceed at your own risk. Laughter levels may get out of hand.</p>
        <div class="prompt-actions">
          <button class="choice choice-yes" id="yes-button" type="button">Yes, let's go</button>
          <button class="choice choice-no" id="no-button" type="button">No, thanks</button>
        </div>
      </div>
    </section>

    <section class="scare" id="scare" aria-label="Video" hidden>
      <video id="video" src="https://coolcutecat.neocities.org/video.mp4" loop playsinline preload="auto"></video>
      <audio id="scare-audio" src="https://coolcutecat.neocities.org/video.mp4" loop preload="auto"></audio>
    </section>
  </main>

  <script>
    const promptBackdrop = document.getElementById("prompt-backdrop");
    const yesButton = document.getElementById("yes-button");
    const noButton = document.getElementById("no-button");
    const reopenButton = document.getElementById("reopen-button");
    const scare = document.getElementById("scare");
    const video = document.getElementById("video");
    const scareAudio = document.getElementById("scare-audio");
    const memeGrid = document.getElementById("meme-grid");
    const fallbackMemes = [
      { name: "Drake Hotline Bling", url: "https://i.imgflip.com/30b1gx.jpg" },
      { name: "Two Buttons", url: "https://i.imgflip.com/1g8my4.jpg" },
      { name: "Distracted Boyfriend", url: "https://i.imgflip.com/1ur9b0.jpg" },
      { name: "Bernie I Am Once Again Asking", url: "https://i.imgflip.com/3oevdk.jpg" },
      { name: "UNO Draw 25 Cards", url: "https://i.imgflip.com/3lmzyx.jpg" },
      { name: "Always Has Been", url: "https://i.imgflip.com/46e43q.png" },
      { name: "Left Exit 12 Off Ramp", url: "https://i.imgflip.com/22bdq6.jpg" },
      { name: "Anakin Padme 4 Panel", url: "https://i.imgflip.com/5c7lwq.png" },
      { name: "Epic Handshake", url: "https://i.imgflip.com/28j0te.jpg" },
      { name: "Gru's Plan", url: "https://i.imgflip.com/26jxvz.jpg" },
      { name: "Disaster Girl", url: "https://i.imgflip.com/23ls.jpg" },
      { name: "Running Away Balloon", url: "https://i.imgflip.com/261o3j.jpg" }
    ];

    function renderMemes(memes) {
      const cards = memes.slice(0, 12).map((meme, index) => {
        const card = document.createElement("article");
        const image = document.createElement("img");
        const meta = document.createElement("div");
        const rank = document.createElement("span");
        const name = document.createElement("span");
        const label = document.createElement("span");

        card.className = "meme-card";
        card.style.animationDelay = `${index * 55}ms`;
        image.src = meme.url;
        image.alt = `${meme.name} meme template`;
        image.loading = index < 4 ? "eager" : "lazy";
        image.decoding = "async";
        meta.className = "meme-meta";
        rank.className = "meme-rank";
        rank.textContent = String(index + 1).padStart(2, "0");
        name.className = "meme-name";
        name.textContent = meme.name;
        label.className = "meme-label";
        label.textContent = "Popular template";

        meta.append(rank, name, label);
        card.append(image, meta);
        return card;
      });

      memeGrid.replaceChildren(...cards);
      memeGrid.setAttribute("aria-busy", "false");
    }

    renderMemes(fallbackMemes);

    fetch("https://api.imgflip.com/get_memes")
      .then((response) => {
        if (!response.ok) throw new Error("Meme feed unavailable");
        return response.json();
      })
      .then((result) => {
        if (result.success && Array.isArray(result.data?.memes)) {
          renderMemes(result.data.memes);
        }
      })
      .catch(() => {});

    async function startScare() {
      promptBackdrop.hidden = true;
      scare.hidden = false;
      video.muted = true;
      video.volume = 1;
      video.currentTime = 0;
      scareAudio.muted = false;
      scareAudio.volume = 1;
      scareAudio.currentTime = 0;

      try {
        const [videoResult, audioResult] = await Promise.allSettled([video.play(), scareAudio.play()]);
        if (videoResult.status === "rejected") throw videoResult.reason;
        if (audioResult.status === "rejected") video.muted = false;
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        }
      } catch {
        scare.hidden = false;
      }
    }

    async function stopScare() {
      video.pause();
      video.currentTime = 0;
      scareAudio.pause();
      scareAudio.currentTime = 0;
      scare.hidden = true;

      if (document.fullscreenElement && document.exitFullscreen) {
        await document.exitFullscreen().catch(() => {});
      }
    }

    yesButton.addEventListener("click", startScare);
    noButton.addEventListener("click", startScare);
    reopenButton.addEventListener("click", () => {
      promptBackdrop.hidden = false;
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !scare.hidden) {
        stopScare();
      }
    });
  </script>
</body>
</html>
